name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage

      - name: Generate coverage report (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          BIN=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -type f | head -1)
          if [ -n "$PROFDATA" ]; then
            xcrun llvm-cov export \
              "$BIN/StreamlineSDKPackageTests.xctest/Contents/MacOS/StreamlineSDKPackageTests" \
              -instr-profile="$PROFDATA" \
              -format=lcov > coverage.lcov 2>/dev/null || true
          fi

      - name: Upload coverage
        if: matrix.os == 'macos-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          fail_ci_if_error: false

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: |
          if command -v swiftformat &> /dev/null; then
            swiftformat --lint Sources/ Tests/ || true
          else
            echo "swiftformat not installed — skipping lint"
          fi

  integration-test:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7

      - name: Start Streamline
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9094/health/live > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start" && exit 1

      - name: Run integration tests
        run: swift test --filter ConformanceTests
        continue-on-error: true

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
