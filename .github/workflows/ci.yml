name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SWIFTFORMAT_VERSION: '0.63.0'
  SWIFTFORMAT_SHA256: 28c7802e11fa5ae113d903066439c6bb1be20a8ac1ad9709c42616a7e273fb0f

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        if: runner.os == 'Linux'
        with:
          # ubuntu-latest ships no Swift toolchain at all; macOS keeps using
          # Xcode's bundled toolchain. 6.1 is required on Linux — see the
          # swift-crypto dependency comment in Package.swift for why (it's a
          # swift-corelibs-foundation URLSession/WebSocket completeness
          # floor, independent of the dependency, plus the minimum needed to
          # parse the pinned swift-crypto manifest).
          swift-version: '6.1'

      - name: Validate package metadata
        run: |
          swift package dump-package
          swift package show-dependencies --format json

      - name: Build SDK and examples
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage

      - name: Generate coverage report (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          BIN=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -type f | head -1)
          if [ -n "$PROFDATA" ]; then
            xcrun llvm-cov export \
              "$BIN/StreamlineSDKPackageTests.xctest/Contents/MacOS/StreamlineSDKPackageTests" \
              -instr-profile="$PROFDATA" \
              -format=lcov > coverage.lcov
          fi

      - name: Upload coverage
        if: matrix.os == 'macos-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.lcov
          fail_ci_if_error: false

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned SwiftFormat
        run: |
          mkdir -p .build/swiftformat
          curl --fail --location --retry 3 \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" \
            --output .build/swiftformat.zip
          echo "${SWIFTFORMAT_SHA256}  .build/swiftformat.zip" | shasum -a 256 --check
          unzip -q .build/swiftformat.zip -d .build/swiftformat
          test "$(.build/swiftformat/swiftformat --version)" = "${SWIFTFORMAT_VERSION}"

      - name: Check formatting
        run: .build/swiftformat/swiftformat --lint Sources/ Tests/ examples/ --reporter github-actions-log

  integration-test:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          # ubuntu-latest ships no Swift toolchain at all. See the `check`
          # job above / Package.swift for why 6.1 is required.
          swift-version: '6.1'

      - name: Verify pinned integration fixture
        run: |
          docker manifest inspect ghcr.io/streamlinelabs/streamline:0.4.0 || {
            echo "::error::Pinned Streamline 0.4.0 integration image is unavailable or requires credentials"
            exit 1
          }

      - name: Start Streamline
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9094/health > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for Streamline... ($i/30)"
            sleep 2
          done
          echo "Server failed to start" && exit 1

      - name: Run integration tests
        run: swift test --filter IntegrationTests
        env:
          STREAMLINE_HTTP_URL: http://localhost:9094
          STREAMLINE_WEBSOCKET_URL: ws://localhost:9092

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
